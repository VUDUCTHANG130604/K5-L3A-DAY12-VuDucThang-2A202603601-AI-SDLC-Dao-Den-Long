name: Verify game
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/verify.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: phase-4-proof
          path: docs/proof/phase-4/
